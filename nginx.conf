server {
	listen 8080;
	server_name _;

	root /usr/share/nginx/html;
	index index.html;
	charset utf-8;

	server_tokens off;

	# --- Compression ---------------------------------------------------
	gzip on;
	gzip_vary on;
	gzip_min_length 256;
	gzip_comp_level 6;
	gzip_types
		text/plain
		text/css
		text/xml
		text/javascript
		application/javascript
		application/json
		application/xml
		application/xml+rss
		application/rss+xml
		image/svg+xml;

	# --- Baseline security headers -------------------------------------
	add_header X-Content-Type-Options "nosniff" always;
	add_header X-Frame-Options "SAMEORIGIN" always;
	add_header Referrer-Policy "strict-origin-when-cross-origin" always;

	# --- Hashed build assets: cache forever ------------------------------
	location /_astro/ {
		add_header Cache-Control "public, max-age=31536000, immutable" always;
		access_log off;
	}

	# --- Images & fonts: cache a week ------------------------------------
	location ~* \.(?:png|jpe?g|gif|svg|ico|webp|avif|woff2?)$ {
		add_header Cache-Control "public, max-age=604800" always;
		access_log off;
	}

	# --- Sitemap & robots.txt: short cache so crawlers see updates fast --
	location ~* \.(?:xml|txt)$ {
		add_header Cache-Control "public, max-age=3600" always;
	}

	# --- HTML: always revalidate so users/crawlers get the latest meta ---
	location / {
		try_files $uri $uri/ =404;
		add_header Cache-Control "public, max-age=0, must-revalidate" always;
	}
}
